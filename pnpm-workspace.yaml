packages:
  - "packages/*"
  - "frontend"
  - "demos"
  - "tools"
  - "services/*"
  - "shared/*"
allowBuilds:
  esbuild: true
  # 네이티브 바이너리를 내려받는 설치 스크립트는 필요할 때만 켠다.
  #
  # onnxruntime-node를 M11에서 켰다. 서버측 추론(`services/matcher`)이 여기서만 돈다 —
  # 브라우저에는 안 들어간다. 기획안 §14의 "온디바이스 임베딩 번들 크기 … 해결"이
  # 뒤집힌 것이 아니라, **짐을 기기에서 서버로 옮긴 것**이다. 옮긴 대가는 따로 진다
  # (오프라인·지연·운영). 그 구분을 §14에 새 행으로 적는다.
  onnxruntime-node: true
  protobufjs: false
  sharp: false
  workerd: set this to true or false
