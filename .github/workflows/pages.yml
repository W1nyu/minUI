# 데모 두 벌을 한 주소에 올린다.
#
#   https://w1nyu.github.io/minUI/        실제 금융사 5곳 + Studio  (demos)
#   https://w1nyu.github.io/minUI/bank/   미니은행, 이체까지 도는 곳 (frontend)
#
# GitHub Pages는 정적 호스팅이라 Node 서버를 못 올린다. 그래서 /api/* 중계가 없고,
# 그 자리는 이렇게 메운다:
#
#   explain  사전 생성 JSON (label+path 순수 조회라 미리 구울 수 있다)
#   studio   사전 생성 JSON 재생
#   assist   따로 띄운 중계기가 있으면 쓰고, 없으면 되묻기로 강등된다.
#            **시연 대본은 이것에 기대지 않는다** (services/assist-worker)
#   원격 신경망  끔 (semantic-focus 12.4%로 게이트를 못 넘었다)
#
# 프로덕션에 API 키가 아예 존재하지 않는다는 뜻이기도 하다 (절대 보호선 규칙 7).

name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 밀린 것은 최신 하나만 남기되 진행 중인 것은 끝내게 둔다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 프로젝트 페이지라 저장소 이름이 기준 경로가 된다. 로컬은 기본값 "/"라
      # `pnpm --filter demos dev`는 지금까지와 똑같이 돈다.
      MINUI_BASE: /minUI/
      # 도우미 중계기(services/assist-worker) 주소. **비어 있으면 도우미가 아예 안 붙는다** —
      # 화면은 로컬 검색 → 되묻기로 끝나고, 프로덕션 번들에서 호출 경로 자체가 사라진다.
      # 켜려면 저장소 Variables에 ASSIST_URL을 넣는다. 코드는 안 고쳐도 된다.
      VITE_ASSIST_URL: ${{ vars.ASSIST_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tsconfig에 paths가 없어 tsc는 워크스페이스 심링크의 exports를 따라
      # dist/*.d.ts로 간다. 그래서 앱보다 패키지를 먼저 빌드해야 한다.
      - name: 패키지 먼저 빌드
        run: pnpm --filter "./packages/*" build

      - name: 테스트
        run: pnpm test

      - name: 데모 빌드
        run: pnpm --filter demos build

      - name: 미니은행 빌드
        run: pnpm --filter frontend build

      - name: 한 폴더로 합친다
        run: |
          mkdir -p site
          cp -r demos/dist/. site/
          mkdir -p site/bank
          cp -r frontend/dist/. site/bank/
          # Pages는 SPA 재작성을 안 해 준다. /minUI/shinhan 같은 깊은 주소는
          # 404로 떨어지는데, 그때 404.html이 대신 뜨면 앱이 스스로 경로를 읽는다.
          cp demos/dist/index.html site/404.html
          # 밑줄로 시작하는 파일을 Jekyll이 숨기지 않게 한다.
          touch site/.nojekyll
          ls -R site | head -30

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 배포된 주소를 실제 브라우저로 밟아 본다. Vitest는 로컬 소스를 재고,
  # base path·정적 자산·API 부재·브라우저 저장소는 여기서만 드러난다.
  #
  # 실패해도 배포를 되돌리지 않는다 — 이미 올라간 것을 내리는 것이 더 위험하고,
  # 무엇이 깨졌는지는 이 로그가 말해 준다.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # playwright-core는 브라우저를 내려받지 않는다. 러너에 이미 있는 크롬을 쓴다 —
      # 제3자 액션을 하나 더 들이는 것보다 낫다. 없으면 스크립트가 그렇게 말하고 멈춘다.
      - name: 크롬 확인
        run: google-chrome --version || chromium --version

      - name: 공개 배포 스모크
        env:
          SMOKE_BASE_URL: https://w1nyu.github.io/minUI/
          # Pages 반영이 늦을 수 있다. 횟수를 정해 두고만 기다린다 (8회 × 6초).
          SMOKE_RETRIES: "8"
        run: pnpm --filter @minui/smoke smoke
