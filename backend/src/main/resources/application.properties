spring.application.name=minui-bank

# compose.yaml이 5433으로 노출한다. 로컬에 다른 Postgres가 떠 있어도 부딪히지 않게.
spring.datasource.url=jdbc:postgresql://localhost:5433/minui_bank
spring.datasource.username=minui
spring.datasource.password=minui

# 데모라 스키마는 JPA가 만든다. 실제 계정계라면 마이그레이션 도구를 쓴다.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 잔액은 원장 합계로 구한다(§10.1). 그 합계 질의가 어떻게 나가는지 보이는 편이
# 데모의 설명력에 도움이 된다.
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=INFO

# 데모 앱은 Vite 개발 서버에서 뜬다.
minui.cors.allowed-origins=http://localhost:5173,http://localhost:4173
