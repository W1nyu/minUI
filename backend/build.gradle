plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.minui'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 시연용 사람 표를 읽는 데 쓴다 (`DemoPersonaCatalog`). 4.x의 모듈형 스타터는
	// jackson을 컴파일 경로까지 끌어오지 않아 여기서 명시한다.
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

/*
 * 시연용 사람 표를 클래스패스에 싣는다.
 *
 * 이 파일은 **브라우저 원장과 같은 것**이다 (`frontend/src/session/personas.ts`가 같은
 * 파일을 import 한다). 복사본을 backend 아래 따로 두면 그 순간부터 두 원장이 서로 다른
 * 사람을 알게 된다 — `openbanking-cases.json`을 한 곳에 둔 것과 같은 이유다.
 */
processResources {
	from('../shared/contracts') {
		include 'demo-users.json'
	}
}

tasks.named('test') {
	useJUnitPlatform()

	// 오류 계약 표를 **입력으로 선언한다.**
	//
	// 안 하면 Gradle이 자바 소스만 보고 up-to-date라 판단해, 표를 고쳐도 이 테스트가
	// 안 돈다. 실제로 표를 일부러 틀리게 해 봤더니 정적 Mock 쪽은 걸렸는데 여기는
	// `BUILD SUCCESSFUL in 1s`로 지나갔다 — 그러면 대조가 가짜가 된다.
	inputs.file(rootProject.file('../shared/contracts/openbanking-cases.json'))
			.withPropertyName('openBankingContract')
			.withPathSensitivity(PathSensitivity.RELATIVE)

	// 사람 표도 같은 이유로 입력이다. 사람을 늘리고 테스트가 안 도는 것이 제일 나쁘다.
	inputs.file(rootProject.file('../shared/contracts/demo-users.json'))
			.withPropertyName('demoUsersContract')
			.withPathSensitivity(PathSensitivity.RELATIVE)
}

// AssertJ는 spring-boot-starter-test에 딸려 오지만, 4.x의 모듈형 스타터에서는
// 명시적으로 넣어야 한다.
dependencies {
	testImplementation 'org.assertj:assertj-core'

	// 같은 사정. 오류 계약 표(shared/contracts/openbanking-cases.json)를 읽는 데 쓴다 —
	// 정적 Mock 쪽 테스트와 **같은 파일**을 봐야 둘이 갈라지는 것을 잡을 수 있다.
	testImplementation 'com.fasterxml.jackson.core:jackson-databind'
}
