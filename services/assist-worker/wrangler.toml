# 배포: services/assist-worker에서
#
#   pnpm dlx wrangler secret put GOOGLE_API_KEY     # 키는 여기에만 둔다
#   pnpm dlx wrangler deploy
#
# 키는 시크릿이라 이 파일에도 저장소에도 번들에도 없다 (절대 보호선 규칙 7).
name = "minui-assist"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

[vars]
# 여기 적힌 곳에서 온 요청만 받는다. 남의 사이트가 우리 한도를 태우지 못하게.
ALLOWED_ORIGINS = "https://w1nyu.github.io,http://localhost:5174,http://localhost:5173"
GEMINI_MODEL = "gemini-3.1-flash-lite"
# 캐시 미스만 센다. 다 쓰면 되묻기로 내려간다 — 기능이 죽는 것이 아니다.
DAILY_BUDGET = "800"
