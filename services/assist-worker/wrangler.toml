# 배포: services/assist-worker에서
#
#   pnpm dlx wrangler secret put GOOGLE_API_KEY        # 키는 여기에만 둔다
#   pnpm dlx wrangler secret put OPENAI_COMPAT_API_KEY # 두 번째 공급자 (선택)
#   pnpm dlx wrangler deploy
#
# 키는 시크릿이라 이 파일에도 저장소에도 번들에도 없다 (절대 보호선 규칙 7).
#
# **네 경로를 중계한다** (AI-2). /assist /explain /clarify /confirm.
# 루트(/)는 /assist로 읽는다 — 이미 넣어 둔 ASSIST_URL을 고치지 않아도 켜지게 하려고.
#
# 두 번째 공급자는 **없어도 된다.** 있으면 Gemini가 한도(429)나 장애로 막혔을 때
# 받는다. 시연 중에 한도가 끊겨 기능이 죽는 것이 기획안 §14의 리스크이고,
# 한도를 둘 이어 붙이는 것이 그것에 대한 답이다.
#
# **벤더를 고르지 않는다.** /chat/completions를 받는 곳이면 무엇이든 되고, 셋이 다
# 있어야 쓴다 — 주소·키·모델. 기본 주소를 두지 않는 이유는 기본값이 있으면 키만 넣은
# 사람이 자기도 모르게 그 벤더로 요청을 보내기 때문이다.
#
#   pnpm dlx wrangler secret put OPENAI_COMPAT_API_KEY
#   그리고 아래 두 vars를 채운다 (비어 있으면 두 번째 공급자를 안 만든다).
name = "minui-assist"
main = "src/worker.ts"
compatibility_date = "2026-01-01"

[vars]
# 여기 적힌 곳에서 온 요청만 받는다. 남의 사이트가 우리 한도를 태우지 못하게.
ALLOWED_ORIGINS = "https://w1nyu.github.io,http://localhost:5174,http://localhost:5173"
GEMINI_MODEL = "gemini-3.1-flash-lite"
# 두 번째 공급자. 쓸 때만 채운다 — 예: "https://api.groq.com/openai/v1" 같은 뿌리 주소.
OPENAI_COMPAT_BASE_URL = ""
OPENAI_COMPAT_MODEL = ""
# 캐시 미스만 센다. 다 쓰면 되묻기로 내려간다 — 기능이 죽는 것이 아니다.
DAILY_BUDGET = "800"
